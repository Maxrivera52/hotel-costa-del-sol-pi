<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">Hotel Costa del Sol - Iniciar Sesión</ui:define>

    <ui:define name="content">
        <div class="row justify-content-center my-4">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-dark text-white text-center py-4 rounded-top-4" style="background-color: #0a2540 !important;">
                        <i class="bi bi-shield-lock-fill fs-1 text-warning mb-2 d-block"></i>
                        <h4 class="fw-bold mb-0">Autenticación de Usuarios - Costa del Sol</h4>
                        <small class="text-light-50">Acceso seguro con JSF Managed Bean</small>
                    </div>
                    
                    <div class="card-body p-4 p-md-5 bg-white">
                        <h:messages globalOnly="true" styleClass="alert alert-danger list-unstyled py-2 px-3 small"/>

                        <h:form id="formLogin">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold text-secondary">
                                    <i class="bi bi-person me-1"></i> Nombre de Usuario
                                </label>
                                <h:inputText id="username" 
                                             value="#{loginBean.username}" 
                                             styleClass="form-control form-control-lg"
                                             required="true"
                                             requiredMessage="Debe ingresar su nombre de usuario."/>
                                <h:message for="username" styleClass="text-danger small"/>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-secondary">
                                    <i class="bi bi-key me-1"></i> Contraseña
                                </label>
                                <h:inputSecret id="password" 
                                               value="#{loginBean.password}" 
                                               styleClass="form-control form-control-lg"
                                               required="true"
                                               requiredMessage="Debe ingresar su contraseña."/>
                                <h:message for="password" styleClass="text-danger small"/>
                            </div>

                            <h:commandButton value="Ingresar al Sistema" 
                                             action="#{loginBean.autenticar}" 
                                             styleClass="btn btn-warning btn-lg w-100 fw-bold shadow-sm"/>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
